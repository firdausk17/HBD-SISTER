<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday</title>
<style>
  :root{
    --cream:#f7ede1;
    --purple:#8b6fae;
    color-scheme: light;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:#3a2f4a;font-family:'Segoe UI',system-ui,sans-serif;overflow-x:hidden;}
  body{
    min-height:100%;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
    display:flex;align-items:center;justify-content:center;
  }
  .stage{width:100%;max-width:1200px;padding:24px 12px;position:relative;}

  /* ---------- COVER ---------- */
  #cover-wrap{
    display:flex;justify-content:center;
    transition:opacity .8s ease, transform .8s ease;
  }
  #cover-wrap.hidden{opacity:0;transform:scale(.92);pointer-events:none;position:absolute;inset:0;}
  .cover-card{
    position:relative;max-width:420px;width:100%;
    border-radius:14px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.5);
    cursor:pointer;
  }
  .cover-card img{width:100%;display:block;}
  .ribbon-hotspot{
    position:absolute;left:50%;top:48.5%;width:26%;height:14%;
    transform:translate(-50%,-50%);
    border-radius:50%;
    animation:pulse 1.8s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,.55);}
    50%{box-shadow:0 0 0 14px rgba(255,255,255,0);}
  }
  .cover-fold{
    position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(90deg,
      rgba(0,0,0,0) 46%,
      rgba(0,0,0,.16) 49.3%,
      rgba(0,0,0,.28) 50%,
      rgba(255,255,255,.22) 50.7%,
      rgba(0,0,0,0) 54%);
  }
  .hint{
    text-align:center;color:#f0e6ff;margin-top:14px;font-size:.95rem;letter-spacing:.03em;
    opacity:.85;
  }

  /* ---------- TRIFOLD ---------- */
  #trifold-outer{position:relative;display:none;}
  #trifold-outer.show{display:block;}
  #trifold{
    display:flex;gap:0;
    background:#fff;border-radius:14px;overflow:hidden;
    box-shadow:0 20px 60px rgba(0,0,0,.5);
    opacity:0;transform:scale(.92);
    transition:opacity .8s ease .15s, transform .8s ease .15s;
  }
  #trifold-outer.show #trifold{opacity:1;transform:scale(1);}
  .panel{
    position:relative;flex:1 1 0;min-width:0;
    aspect-ratio:2/3;overflow:hidden;
  }
  .panel img.bg{width:100%;height:100%;object-fit:cover;display:block;}
  .fold-line{
    position:absolute;top:0;bottom:0;width:22px;right:-11px;z-index:5;
    background:linear-gradient(90deg, rgba(0,0,0,.22), rgba(0,0,0,0) 40%, rgba(0,0,0,0) 60%, rgba(0,0,0,.22));
    pointer-events:none;
  }
  .fold-line.left-edge{right:auto;left:-11px;}
  .panel-shade{
    position:absolute;inset:0;z-index:4;pointer-events:none;
    background:linear-gradient(90deg, rgba(0,0,0,.10) 0%, rgba(0,0,0,0) 10%, rgba(0,0,0,0) 90%, rgba(0,0,0,.10) 100%);
  }
  #panel-left, #panel-center{ }

  /* ----- candles ----- */
  .candle{position:absolute;width:3.2%;height:9%;transform-origin:bottom center;}
  .candle .stick{width:100%;height:70%;background:repeating-linear-gradient(0deg,#e8557a 0 4px,#fff 4px 8px);border-radius:2px;position:absolute;bottom:0;}
  .candle .flame{
    position:absolute;top:-38%;left:50%;transform:translateX(-50%);
    width:64%;aspect-ratio:1/1.4;
    background:radial-gradient(circle at 50% 70%, #fff6b0 0%, #ffb347 45%, #ff6a3d 80%);
    border-radius:50% 50% 50% 50%/60% 60% 40% 40%;
    filter:blur(.2px);
    animation:flicker 1s ease-in-out infinite alternate;
    transition:opacity .3s ease, transform .5s ease;
  }
  @keyframes flicker{
    0%{transform:translateX(-50%) scale(1) rotate(-3deg);}
    100%{transform:translateX(-50%) scale(1.12) rotate(3deg);}
  }
  .candle.out .flame{opacity:0;transform:translateX(-50%) scale(.2) translateY(6px);}
  .smoke{
    position:absolute;top:-42%;left:50%;transform:translateX(-50%);
    width:10px;height:10px;border-radius:50%;
    background:rgba(200,200,200,.5);opacity:0;pointer-events:none;
  }
  .candle.out .smoke{animation:smokeUp 1.4s ease-out forwards;}
  @keyframes smokeUp{
    0%{opacity:.7;transform:translate(-50%,0) scale(.5);}
    100%{opacity:0;transform:translate(-50%,-40px) scale(1.8);}
  }

  .blow-btn{
    position:absolute;left:50%;bottom:4%;transform:translateX(-50%);
    background:#ff6f91;color:#fff;border:none;padding:10px 18px;border-radius:30px;
    font-size:.85rem;font-weight:600;cursor:pointer;box-shadow:0 6px 16px rgba(0,0,0,.3);
    z-index:6;transition:transform .2s ease, opacity .4s ease;
    overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none;
  }
  .blow-btn .fill{
    position:absolute;left:0;top:0;bottom:0;width:0%;
    background:rgba(255,255,255,.4);z-index:-1;transition:width .05s linear;
  }
  .blow-btn:active{transform:translateX(-50%) scale(.97);}
  .blow-btn.done{opacity:0;pointer-events:none;}

  /* ---------- back to cover ---------- */
  .back-btn{
    position:absolute;top:-14px;left:50%;transform:translateX(-50%) rotate(-2deg);
    background:#fbf6ef;color:#5c4a3a;border:1px solid rgba(0,0,0,.08);
    padding:8px 16px;border-radius:6px;font-size:.8rem;font-weight:600;
    cursor:pointer;box-shadow:0 6px 14px rgba(0,0,0,.25);z-index:20;
  }

  .confetti-piece{
    position:absolute;top:40%;left:50%;width:8px;height:14px;
    opacity:0;z-index:7;pointer-events:none;
  }

  /* ----- envelope / letter ----- */
  #panel-right{overflow:visible;}
  .letter-img{
    position:absolute;left:50%;bottom:34%;
    width:62%;
    transform:translate(-50%,10%);
    box-shadow:0 8px 24px rgba(0,0,0,.35);
    border-radius:2px;
    transition:transform .9s cubic-bezier(.2,.8,.2,1), z-index 0s .9s;
    z-index:2;cursor:pointer;
  }
  .env-front{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:3;}
  .seal-hotspot{
    position:absolute;left:50%;top:62%;width:16%;height:10%;
    transform:translate(-50%,-50%);border-radius:50%;z-index:4;cursor:pointer;
    animation:pulse 1.8s ease-in-out infinite;
  }
  #panel-right.opened .letter-img{transform:translate(-50%,-8%);z-index:5;transition:transform .9s cubic-bezier(.2,.8,.2,1), z-index 0s;}
  #panel-right.opened .seal-hotspot{pointer-events:none;animation:none;}

  @media (max-width:700px){
    .stage{padding:16px 10px;}
    #trifold{flex-direction:column;border-radius:12px;}
    .panel{aspect-ratio:2/3;}
    .fold-line{display:none;}
    .panel-shade{display:none;}
    .back-btn{top:-12px;font-size:.72rem;padding:7px 12px;}
    .blow-btn{font-size:.8rem;padding:9px 14px;bottom:3%;}
    .cover-card{max-width:320px;}
  }
</style>
</head>

<script>
// ---- open / close cover ----
var coverWrap = document.getElementById('cover-wrap');
var trifoldOuter = document.getElementById('trifold-outer');

document.getElementById('ribbon-hotspot').addEventListener('click', function(){
  coverWrap.classList.add('hidden');
  trifoldOuter.classList.add('show');
});

document.getElementById('back-btn').addEventListener('click', function(){
  trifoldOuter.classList.remove('show');
  coverWrap.classList.remove('hidden');
  resetCard();
});

function resetCard(){
  document.querySelectorAll('.candle').forEach(function(c){ c.classList.remove('out'); });
  document.getElementById('blow-btn').classList.remove('done');
  document.getElementById('blow-fill').style.width='0%';
  document.getElementById('panel-right').classList.remove('opened');
  document.querySelectorAll('.confetti-piece').forEach(function(n){ n.remove(); });
}

// ---- candles ----
var candlePositions = [
  {left:38, top:44},
  {left:48, top:41},
  {left:58, top:44}
];
var candlesWrap = document.getElementById('candles');
candlePositions.forEach(function(p){
  var c = document.createElement('div');
  c.className='candle';
  c.style.left = p.left+'%';
  c.style.top = p.top+'%';
  c.innerHTML = '<div class="stick"></div><div class="flame"></div><div class="smoke"></div>';
  candlesWrap.appendChild(c);
});

// ---- hold-to-blow ----
var blowBtn = document.getElementById('blow-btn');
var blowFill = document.getElementById('blow-fill');
var holdTimer = null, holdStart = 0, holding = false;
var HOLD_MS = 900;

function startHold(e){
  if (blowBtn.classList.contains('done')) return;
  e.preventDefault();
  holding = true;
  holdStart = Date.now();
  step();
}
function step(){
  if(!holding) return;
  var pct = Math.min(100, (Date.now()-holdStart)/HOLD_MS*100);
  blowFill.style.width = pct+'%';
  if(pct>=100){
    finishBlow();
  } else {
    holdTimer = requestAnimationFrame(step);
  }
}
function cancelHold(){
  holding = false;
  if(holdTimer) cancelAnimationFrame(holdTimer);
  if(!blowBtn.classList.contains('done')) blowFill.style.width='0%';
}
function finishBlow(){
  holding = false;
  if(holdTimer) cancelAnimationFrame(holdTimer);
  document.querySelectorAll('.candle').forEach(function(c){ c.classList.add('out'); });
  blowBtn.classList.add('done');
  burstConfetti();
}
blowBtn.addEventListener('pointerdown', startHold);
blowBtn.addEventListener('pointerup', cancelHold);
blowBtn.addEventListener('pointerleave', cancelHold);
blowBtn.addEventListener('pointercancel', cancelHold);

function burstConfetti(){
  var colors = ['#ff6f91','#ffc75f','#845ec2','#00c9a7','#4d8076','#ff9671'];
  var panel = document.getElementById('panel-center');
  for(var i=0;i<46;i++){
    var el = document.createElement('div');
    el.className='confetti-piece';
    el.style.background = colors[i % colors.length];
    var angle = Math.random()*Math.PI*2;
    var dist = 60 + Math.random()*160;
    var dx = Math.cos(angle)*dist;
    var dy = Math.sin(angle)*dist - 60;
    var rot = Math.random()*720-360;
    el.style.left = (46 + Math.random()*10) + '%';
    el.animate([
      {transform:'translate(0,0) rotate(0deg)', opacity:1},
      {transform:'translate('+dx+'px,'+(dy+180)+'px) rotate('+rot+'deg)', opacity:1, offset:.7},
      {transform:'translate('+dx+'px,'+(dy+260)+'px) rotate('+rot+'deg)', opacity:0}
    ], {duration: 1600+Math.random()*500, easing:'cubic-bezier(.2,.7,.3,1)'});
    panel.appendChild(el);
    (function(node){ setTimeout(function(){ node.remove(); }, 2200); })(el);
  }
}

// ---- envelope / letter (toggle open/close) ----
document.getElementById('seal-hotspot').addEventListener('click', function(){
  document.getElementById('panel-right').classList.toggle('opened');
});
document.getElementById('letter-img').addEventListener('click', function(){
  document.getElementById('panel-right').classList.toggle('opened');
});
</script>
